<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level 1 - Scales</title>

  <link rel="stylesheet" href="../../exercises2.css" />
  <script src="../../scales.js" defer></script>
</head>
<body>
  <div class="exercise-container">
    <h1>Level 1 — Scales</h1>
    <p>
      Practice identifying and understanding all seven major modes.  
      Click <strong>Generate Scale</strong> to get a random mode and root,  
      or enable <strong>Auto Mode</strong> to cycle through them automatically.
    </p>

    <!-- Output Display -->
    <div id="scale-output" class="scale-output">Press “Generate Scale” to begin!</div>

    <!-- Controls -->
    <div class="controls">
      <button id="generate-btn" class="main-btn">🎵 Generate Scale</button>

      <div class="auto-controls">
        <label for="intervalInput">Auto-generate every (seconds):</label>
        <input type="number" id="intervalInput" value="5" min="1" />
        <button id="autoBtn" class="main-btn">▶ Start Auto</button>
      </div>

      <!-- Timer Circle -->
      <div class="timer-container">
        <svg class="timer-svg" width="100" height="100">
          <circle class="timer-bg" cx="50" cy="50" r="45" />
          <circle class="timer-progress" cx="50" cy="50" r="45" />
        </svg>
        <div id="timer-text" class="timer-text">5</div>
      </div>
    </div>

    <button onclick="window.history.back()" class="back-btn">← Back</button>
  </div>

  <!-- Metronome -->
  <div class="metronome">
    <h3>Metronome</h3>
    <div class="metro-controls">
      <label>Tempo:</label>
      <input type="number" id="tempoInput" value="100" min="30" max="300" />
      <label>Sound:</label>
      <select id="metroSound">
        <option value="1">Metronome 1</option>
        <option value="2">Metronome 2</option>
        <option value="3">Metronome 3</option>
        <option value="4">Metronome 4</option>
      </select>
      <button id="metroToggle" class="main-btn">Start</button>
    </div>
  </div>
</body>
</html>
