<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmoniq - Music Theory Arcade</title>
  <link rel="stylesheet" href="arcade.css" />
</head>
<body>
  <div class="arcade-container">
    <h1 class="arcade-title">Music Theory Arcade</h1>

    <!-- Leaderboard UI -->
    <div class="leaderboard">
      <button class="arrow left-arrow" id="prevGame" aria-label="Previous Game">&lt;</button>
      <button class="arrow right-arrow" id="nextGame" aria-label="Next Game">&gt;</button>

      <div class="leaderboard-content">
        <h3 id="leaderboard-title">Note Name Blitz Leaderboard</h3>
        <ul id="leaderboard-list"></ul>
      </div>
    </div>

    <div class="arcade-machines">
      <div class="machine" id="interval-inspector" data-label="Interval Inspector" onclick="window.location.href='games/interval-id.html'">
        <div class="label">Interval Inspector</div>
        <img src="arcade-assets/interval-id.png" alt="Interval Inspector Arcade" />
      </div>
      <div class="machine" id="note-name-blitz" data-label="Note Name Blitz" onclick="window.location.href='games/note-name-blitz.html'">
        <div class="label">Note Name Blitz</div>
        <img src="arcade-assets/note-name.png" alt="Note Name Blitz Arcade" />
      </div>
      <div class="machine" id="chord-id-challenge" data-label="Chord ID Challenge" onclick="window.location.href='games/chord-id.html'">
        <div class="label">Chord ID Challenge</div>
        <img src="arcade-assets/chord-id.png" alt="Chord ID Challenge Arcade" />
      </div>
      <div class="machine" id="interval-ear-duel" data-label="Interval Ear Duel" onclick="window.location.href='games/interval-ear-duel.html'">
        <div class="label">Interval Ear Duel</div>
        <img src="arcade-assets/ear-interval.png" alt="Interval Ear Duel Arcade" />
      </div>
      <div class="machine" id="rhythm-echo" data-label="Rhythm Echo" onclick="window.location.href='games/rhythm-echo.html'">
        <div class="label">Rhythm Echo</div>
        <img src="arcade-assets/rhythm-match.png" alt="Rhythm Echo Arcade" />
      </div>
    </div>
  </div>

  <audio id="hover-sound" src="sounds/arcade-hover.mp3" preload="auto"></audio>
  <audio id="click-sound" src="sounds/arcade-click.mp3" preload="auto"></audio>
  <audio id="hover-bleep" src="arcade-assets/bleep.mp3" preload="auto"></audio>
  <audio id="click-bleep" src="arcade-assets/bleep-click.mp3" preload="auto"></audio>
  <audio id="bg-music" loop preload="auto"></audio>
  <audio id="leaderboard-snap" src="arcade-assets/bleep.mp3" preload="auto"></audio>

  <a href="../index.html" class="back-arrow" title="Back to Welcome Page">←</a>
  <button id="mute-btn" title="Mute/Unmute Background Music">🔊</button>

  <script src="arcade.js"></script>
</body>
</html>
