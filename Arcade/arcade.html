<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmoniq - Music Theory Arcade</title>
  <link rel="stylesheet" href="arcade.css" />
  <style>
    
    /* Mute button styles */
    #mute-btn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: #00ffcc;
      font-size: 24px;
      cursor: pointer;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
      z-index: 1000;
      user-select: none;
    }
    #mute-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    /* Arcade container fixes */
    .arcade-container {
      position: relative;
      width: 100%;
      height: 350px;
      padding: 20px 0;
    }

    .arcade-machines {
      position: relative;
      width: 100%;
      height: 100%;
      white-space: nowrap;
      left: -6%;
    }

    .machine {
      position: absolute;
      top: 60%; /* Bringing the machines a bit down */
      transform-origin: center bottom;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #interval-inspector { left: 30%; transform: translateY(-50%); }
    #note-name-blitz { left: 40%; transform: translateY(-50%); }
    #chord-id-challenge { left: 50%; transform: translateY(-50%); }
    #interval-ear-duel { left: 60%; transform: translateY(-50%); }
    #rhythm-echo { left: 70%; transform: translateY(-50%); }

    .machine:hover {
      transform: translateY(-50%) scale(1.1);
      z-index: 10;
    }

    .label {
      text-align: center;
      margin-bottom: 6px;
      font-family: 'Press Start 2P', monospace;
      color: #ff00cc;
      user-select: none;
    }

    .machine img {
      display: block;
      width: 120px;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    #visualizer {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      opacity: 0.2;
      pointer-events: none;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Title styles - keep original color, just add a smooth transform */
    .arcade-title {
      font-family: 'Press Start 2P', monospace;
      color: #ff00cc; /* keep original color */
      text-align: center;
      font-size: 2rem;
      transition: transform 0.1s ease;
      will-change: transform;
      user-select: none;
    }

    #myImage {
      position: fixed;   /* or absolute if you want relative to a container */
      bottom: 10px;      /* 10px from bottom */
      left: 10px;        /* 10px from left */
      width: 150px;      /* or whatever size fits */
      height: auto;
      z-index: 50;       /* above arcade machines but below UI if needed */
      pointer-events: none; /* so it doesn’t block clicks */
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div class="arcade-container">
    <h1 class="arcade-title">Music Theory Arcade</h1>
  

    <!-- Leaderboard UI -->
    <div class="leaderboard">
      <button class="arrow left-arrow" id="prevGame" aria-label="Previous Game">&lt;</button>
      <button class="arrow right-arrow" id="nextGame" aria-label="Next Game">&gt;</button>

      <div class="leaderboard-content">
        <h3 id="leaderboard-title">Note Name Blitz Leaderboard</h3>
        <ul id="leaderboard-list"></ul>
      </div>
    </div>

    <div class="arcade-machines">
      <div class="machine" id="interval-inspector" data-label="Interval Inspector" onclick="window.location.href='games/interval-id.html'">
        <div class="label">Interval Inspector</div>
        <img src="arcade-assets/interval-id.png" alt="Interval Inspector Arcade" />
      </div>
      <div class="machine" id="note-name-blitz" data-label="Note Name Blitz" onclick="window.location.href='games/note-name-blitz.html'">
        <div class="label">Note Name Blitz</div>
        <img src="arcade-assets/note-name.png" alt="Note Name Blitz Arcade" />
      </div>
      <div class="machine" id="chord-id-challenge" data-label="Chord ID Challenge" onclick="window.location.href='games/chord-id.html'">
        <div class="label">Chord ID Challenge</div>
        <img src="arcade-assets/chord-id.png" alt="Chord ID Challenge Arcade" />
      </div>
      <div class="machine" id="interval-ear-duel" data-label="Interval Ear Duel" onclick="window.location.href='games/interval-ear-duel.html'">
        <div class="label">Interval Ear Duel</div>
        <img src="arcade-assets/ear-interval.png" alt="Interval Ear Duel Arcade" />
      </div>
      <div class="machine" id="rhythm-echo" data-label="Rhythm Echo" onclick="window.location.href='games/rhythm-echo.html'">
        <div class="label">Rhythm Echo</div>
        <img src="arcade-assets/rhythm-match.png" alt="Rhythm Echo Arcade" />
      </div>
    </div>
  </div>

  <audio id="hover-sound" src="sounds/arcade-hover.mp3" preload="auto"></audio>
  <audio id="click-sound" src="sounds/arcade-click.mp3" preload="auto"></audio>
  <audio id="hover-bleep" src="arcade-assets/bleep.mp3" preload="auto"></audio>
  <audio id="click-bleep" src="arcade-assets/bleep-click.mp3" preload="auto"></audio>
  <audio id="bg-music" loop preload="auto"></audio>
  <audio id="leaderboard-snap" src="arcade-assets/bleep.mp3" preload="auto"></audio>

  <a href="../index.html" class="back-arrow" title="Back to Welcome Page">←</a>

  <button id="mute-btn" title="Mute/Unmute Background Music">🔊</button>

  <canvas id="visualizer"></canvas>

  <script src="arcade.js"></script>

  <script>
    const tracks = [
      'audio/you-got-it.mp3',
      'audio/i-want.mp3',
      'audio/alesis.mp3',
      'audio/rylee.mp3',
      'audio/small-hope.mp3',
    ];

    const bgMusic = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');
    const title = document.querySelector('.arcade-title');

    function playRandomTrack() {
      const randomIndex = Math.floor(Math.random() * tracks.length);
      bgMusic.src = tracks[randomIndex];
      bgMusic.volume = 0.2;

      const isMuted = localStorage.getItem('bgMusicMuted') === 'true';
      bgMusic.muted = isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';

      bgMusic.play().catch(() => {
        // Sometimes play must be triggered by user interaction
        window.addEventListener('click', () => bgMusic.play(), { once: true });
      });
    }

    function toggleMute() {
      const currentlyMuted = bgMusic.muted;
      bgMusic.muted = !currentlyMuted;
      localStorage.setItem('bgMusicMuted', bgMusic.muted);
      muteBtn.textContent = bgMusic.muted ? '🔇' : '🔊';
    }

    muteBtn.addEventListener('click', toggleMute);
    window.addEventListener('load', playRandomTrack);

    function renderLeaderboard() {
      const leaderboard = JSON.parse(localStorage.getItem("noteNameBlitzLeaderboard")) || [];
      const container = document.getElementById("leaderboard-list");
      if (container) {
        container.innerHTML = leaderboard.map(entry => `<li><strong>${entry.name}</strong>: ${entry.score}</li>`).join("");
      }
    }

    document.addEventListener("DOMContentLoaded", renderLeaderboard);

    // Canvas setup for visualizer bars
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Web Audio API setup for analyzing bgMusic
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // Must resume context on user interaction (some browsers require it)
    function resumeAudioContext() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      window.removeEventListener('click', resumeAudioContext);
    }
    window.addEventListener('click', resumeAudioContext);

    const source = audioCtx.createMediaElementSource(bgMusic);
    const analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 256;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    // Get average amplitude from dataArray for scaling
    function getAverageAmplitude() {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < bufferLength; i++) {
        sum += dataArray[i];
      }
      return sum / bufferLength;
    }

    const myImage = document.getElementById('myImage');

    function draw() {
      requestAnimationFrame(draw);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      analyser.getByteFrequencyData(dataArray);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let barHeight;
      let x = 0;

      // Draw purple bars
      for (let i = 0; i < bufferLength; i++) {
        barHeight = dataArray[i];
        // Purple color with some dynamic brightness
        ctx.fillStyle = `rgb(${barHeight / 2}, 0, ${barHeight})`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }

      const avg = getAverageAmplitude();

      // Scale range from 1 to 2
      const minScale = 1.0;
      const maxScale = 2.0;
      let scale = minScale + (avg / 255) * (maxScale - minScale);

      title.style.transform = `scale(${scale})`;
      myImage.style.transform = `scale(${scale})`;
    }

    draw();
  </script>
</body>
</html>
