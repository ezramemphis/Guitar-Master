  <!-- Panel Buttons Script -->
  <script>
    const panelButtonsContainer = document.getElementById("panelButtons");
    const levels = ["Level 1","Level 2","Level 3","Level 4"];
    const exercises = ["Chords","Scales","Arpeggios"];

    function createButton(text, href="#") {
      const btn = document.createElement("button");
      btn.classList.add("panel-btn");
      btn.textContent = text;
      if(href !== "#") btn.addEventListener("click", () => window.location.href = href);
      return btn;
    }

    function showLevelButtons() {
      panelButtonsContainer.innerHTML = "";
      levels.forEach((lvl, i) => {
        const btn = createButton(lvl);
        btn.addEventListener("click", () => showExerciseButtons(i+1));
        panelButtonsContainer.appendChild(btn);
      });
    }

    function showExerciseButtons(level) {
      panelButtonsContainer.innerHTML = "";
      exercises.forEach(ex => {
        const href = `exercises/level${level}/level${level}_${ex.toLowerCase()}.html`;
        panelButtonsContainer.appendChild(createButton(ex, href));
      });
      const backBtn = createButton("← Back");
      backBtn.addEventListener("click", showLevelButtons);
      panelButtonsContainer.appendChild(backBtn);
    }

    showLevelButtons();
  </script>

  <!-- Theme Selection Script -->
  <script>
    const themeBtn = document.getElementById("themeBtn");
    const themeMenu = document.getElementById("themeMenu");
    const themeList = document.getElementById("themeList");
    const closeThemeMenu = document.getElementById("closeThemeMenu");

    let currentThemeScript = null;

    function loadTheme(themeFile) {
      if (currentThemeScript) currentThemeScript.remove();
      currentThemeScript = document.createElement("script");
      currentThemeScript.src = `themes/${themeFile}`;
      currentThemeScript.id = "bgThemeScript";
      document.body.appendChild(currentThemeScript);
    }

    // Default theme on load
    window.addEventListener("DOMContentLoaded", () => {
      loadTheme("stars.js");
    });

    // Toggle theme menu
    themeBtn.addEventListener("click", () => {
      themeMenu.style.display = themeMenu.style.display === "block" ? "none" : "block";
    });

    closeThemeMenu.addEventListener("click", () => {
      themeMenu.style.display = "none";
    });

    themeList.querySelectorAll("li").forEach(li => {
      li.addEventListener("click", () => {
        const themeFile = li.dataset.theme;
        loadTheme(themeFile);
        themeMenu.style.display = "none";
      });
    });
  </script>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const hoverSoundFile = "assets/sounds/ice.wav"; 
  const clickSoundFile = "assets/sounds/thin_click.wav"; 

  function playHoverSound() {
    const sound = new Audio(hoverSoundFile);
    sound.volume = 0.35;
    sound.play().catch(() => {});
  }

  function playClickSound() {
    const sound = new Audio(clickSoundFile);
    sound.volume = 0.35;
    sound.play().catch(() => {});
  }

  // Panel buttons hover + click
  function attachPanelButtonSounds() {
    const buttons = document.querySelectorAll("#panelButtons button");
    buttons.forEach(btn => {
      btn.removeEventListener("mouseenter", playHoverSound);
      btn.removeEventListener("click", playClickSound);
      btn.addEventListener("mouseenter", playHoverSound);
      btn.addEventListener("click", playClickSound);
    });
  }

  attachPanelButtonSounds();

  const panelButtonsContainer = document.getElementById("panelButtons");
  const observer = new MutationObserver(attachPanelButtonSounds);
  observer.observe(panelButtonsContainer, { childList: true });

  // Social icons
  const socialIcons = document.querySelectorAll(".social-icon");
  socialIcons.forEach(icon => {
    icon.removeEventListener("mouseenter", playHoverSound);
    icon.removeEventListener("click", playClickSound);
    icon.addEventListener("mouseenter", playHoverSound);
    icon.addEventListener("click", playClickSound);
  });

  // ⭐ Arcade hover sound
  const arcadeHoverSound = new Audio("assets/sounds/arcade_hover.wav");
  arcadeHoverSound.volume = 0.6;

  const arcadeBtn = document.querySelector(".arcade-container");
  if (arcadeBtn) {
    arcadeBtn.addEventListener("mouseenter", () => {
      arcadeHoverSound.currentTime = 0;
      arcadeHoverSound.play().catch(() => {});
    });
  }
});
</script>



<!-- ✅ Journal Overlay Script (Inline, Always Works) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
  const journalBtn = document.getElementById("journalBtn");
  const overlay = document.getElementById("practiceLogOverlay");
  const closeBtn = document.getElementById("closeJournal");
  const logDateSpan = document.getElementById("logDate");
  const textarea = document.getElementById("practiceText");
  const prevBtn = document.getElementById("prevDay");
  const nextBtn = document.getElementById("nextDay");

  let currentDate = new Date();

  // Audio LPF setup using Web Audio API
  let audioContext, audioSource, lpf;
  const bgAudio = document.querySelector("audio"); // assume your audio element exists

  if (bgAudio) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioSource = audioContext.createMediaElementSource(bgAudio);
    lpf = audioContext.createBiquadFilter();
    lpf.type = "lowpass";
    lpf.frequency.setValueAtTime(22050, audioContext.currentTime); // start fully open
    audioSource.connect(lpf).connect(audioContext.destination);
  }

  function formatReadable(date) {
    return date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function formatKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }

  function loadDate(date) {
    currentDate = date;
    logDateSpan.textContent = formatReadable(date);
    textarea.value = localStorage.getItem(`practiceLog-${formatKey(date)}`) || "";
  }

  function showOverlay() {
    overlay.classList.remove("hide");
    overlay.classList.add("show");
    if (lpf) lpf.frequency.linearRampToValueAtTime(1000, audioContext.currentTime + 0.5); // dull audio
  }

  function hideOverlay() {
    overlay.classList.add("hide");
    overlay.classList.remove("show");
    if (lpf) lpf.frequency.linearRampToValueAtTime(22050, audioContext.currentTime + 0.5); // restore audio
    setTimeout(() => overlay.style.display = "none", 500); // wait for fade
  }

  // Open journal
  journalBtn.addEventListener("click", () => {
    loadDate(new Date());
    overlay.style.display = "flex";
    requestAnimationFrame(showOverlay);
  });

  // Close journal
  closeBtn.addEventListener("click", hideOverlay);

  // Day navigation
  prevBtn.addEventListener("click", () => {
    const newDate = new Date(currentDate);
    newDate.setDate(newDate.getDate() - 1);
    loadDate(newDate);
  });

  nextBtn.addEventListener("click", () => {
    const newDate = new Date(currentDate);
    newDate.setDate(newDate.getDate() + 1);
    loadDate(newDate);
  });

  // Auto-save
  textarea.addEventListener("input", () => {
    localStorage.setItem(`practiceLog-${formatKey(currentDate)}`, textarea.value);
  });
});
  </script>
